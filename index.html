<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرمش ذهن | معماهای منطقی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>

    <script src="data.js"></script>

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #fafaf9;
            color: #1c1917;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Typography Fixes */
        p, h1, h2, h3, div {
            font-feature-settings: "ss01";
        }
        
        /* Math Rendering Overrides */
        .katex { font-size: 1.1em; direction: ltr; unicode-bidi: isolate; }
        
        /* Scrollbar & Transitions */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-transition { transition: all 0.3s ease-out; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        
        /* Interactive Elements */
        .like-btn:active { transform: scale(0.9); }
        .liked-heart { fill: #ef4444; color: #ef4444; }
    </style>
</head>
<body class="min-h-screen max-w-3xl mx-auto px-4 py-8 md:py-12 selection:bg-amber-100 selection:text-amber-900">

    <div id="featured-container" class="mb-12 mt-4"></div>

    <div class="sticky top-0 z-20 bg-[#fafaf9]/95 backdrop-blur-sm py-3 mb-6 -mx-4 px-4 border-b border-transparent transition-all" id="sticky-header">
        <div class="flex justify-between items-center gap-4">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pl-4" id="filter-container">
                <button data-filter="all" class="filter-btn shrink-0 text-xs font-semibold px-4 py-1.5 rounded-full bg-stone-900 text-white transition-colors">همه</button>
                <button data-filter="Logic" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">منطق</button>
                <button data-filter="Combinatorics" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">ترکیبیات</button>
                <button data-filter="Algorithms" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">الگوریتم</button>
                <button data-filter="Graph Theory" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">نظریه گراف</button>
                <button data-filter="Geometry" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">هندسه</button>
            </div>
            <button id="random-btn" class="shrink-0 text-stone-400 hover:text-amber-600 transition-colors" title="انتخاب تصادفی">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            </button>
        </div>
    </div>

    <div id="problem-feed" class="flex flex-col gap-6 pb-20"></div>

    <div id="no-results" class="hidden text-center py-12">
        <p class="text-sm text-stone-400">موردی یافت نشد.</p>
        <button onclick="document.querySelector('[data-filter=all]').click()" class="mt-2 text-xs font-bold text-stone-900 hover:underline">پاک کردن فیلتر</button>
    </div>

    <script type="module">
        // ==========================================
        // 1. Firebase Configuration
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC0q3_lGDHyGNez2-TYcFlQnaQOB-ER_zs",
          authDomain: "mental-caa6d.firebaseapp.com",
          projectId: "mental-caa6d",
          storageBucket: "mental-caa6d.firebasestorage.app",
          messagingSenderId: "749958924464",
          appId: "1:749958924464:web:7ce584ba0015d3aa821375"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // 2. Logic & Icons
        // ==========================================
        
        // --- Enhanced Icon System ---
        const icons = {
            ants: `<path d="M12 2C9 2 7 3.5 7 5C7 5.5 7.2 6 7.5 6.5C6 7 5 8.5 5 10C5 11.5 6 12.8 7.5 13.5C7.2 14 7 14.5 7 15C7 16.5 9 18 12 18C15 18 17 16.5 17 15C17 14.5 16.8 14 16.5 13.5C18 12.8 19 11.5 19 10C19 8.5 18 7 16.5 6.5C16.8 6 17 5.5 17 5C17 3.5 15 2 12 2ZM8 10C8 9.5 8.5 9 9 9H15C15.5 9 16 9.5 16 10C16 10.5 15.5 11 15 11H9C8.5 11 8 10.5 8 10ZM12 20C10.5 20 9 20.5 9 21C9 21.5 9.5 22 10 22H14C14.5 22 15 21.5 15 21C15 20.5 13.5 20 12 20Z" fill="currentColor"/>`,
            grid: `<path d="M4 4H8V8H4V4ZM10 4H14V8H10V4ZM16 4H20V8H16V4ZM4 10H8V14H4V10ZM10 10H14V14H10V10ZM16 10H20V14H16V10ZM4 16H8V20H4V16ZM10 16H14V20H10V16ZM16 16H20V20H16V16Z" fill="currentColor" opacity="0.4"/>`,
            coins: `<circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="16" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="16" r="4" stroke="currentColor" stroke-width="1.5"/>`,
            graph: `<circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="18" cy="6" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/><line x1="6" y1="6" x2="12" y2="18" stroke="currentColor"/><line x1="18" y1="6" x2="12" y2="18" stroke="currentColor"/><line x1="6" y1="6" x2="18" y2="6" stroke="currentColor"/>`,
            prison: `<path d="M4 4H20V20H4V4ZM6 6V18H8V6H6ZM10 6V18H12V6H10ZM14 6V18H16V6H14ZM18 6V18H18V6H18Z" fill="currentColor" opacity="0.3"/>`,
            potion: `<path d="M12 2L14 5H10L12 2ZM6 7H18L20 20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20L6 7Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 12H16" stroke="currentColor" stroke-dasharray="2 2"/>`,
            geo: `<path d="M12 2L2 22H22L12 2Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="14" r="3" fill="currentColor" opacity="0.3"/>`,
            logic: `<path d="M9 21c0 .5.4 1 1 1h4c.6 0 1-.5 1-1v-1H9v1zm3-19C8.1 2 5 5.1 5 9c0 2.4 1.2 4.5 3 5.7V17c0 .5.5 1 1 1h6c.6 0 1-.5 1-1v-2.3c1.8-1.3 3-3.4 3-5.7 0-3.9-3.1-7-7-7z" fill="currentColor" opacity="0.3"/>`,
            default: `<circle cx="12" cy="12" r="8" opacity="0.1" fill="currentColor"/>`
        };

        function getIcon(category, p, isFeatured = false) {
            const title = p.title || "";
            const text = p.text || "";
            const c = isFeatured ? "text-stone-700" : "text-stone-300";
            let content = icons.default;

            // Keyword Matching
            if (title.includes("مورچه") || text.includes("مورچه")) content = icons.ants;
            else if (title.includes("شبکه") || title.includes("شطرنج") || title.includes("دومینو")) content = icons.grid;
            else if (title.includes("سکه")) content = icons.coins;
            else if (title.includes("گراف") || title.includes("دوستی")) content = icons.graph;
            else if (title.includes("زندانی") || title.includes("جعبه") || title.includes("اتاق")) content = icons.prison;
            else if (title.includes("سم") || title.includes("لیوان") || title.includes("شراب")) content = icons.potion;
            else if (category === "Geometry" || title.includes("مثلث") || title.includes("کره")) content = icons.geo;
            else if (category === "Logic") content = icons.logic;

            return `<svg class="w-full h-full ${c}" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet">${content}</svg>`;
        }

        const today = new Date().toISOString().split('T')[0];
        const problems = (window.allProblems || []).filter(p => {
            if (!p.releaseDate) return true;
            return p.releaseDate <= today;
        });

        let state = {
            currentFilter: 'all',
            solvedIds: new Set(JSON.parse(localStorage.getItem('mg_solved')) || []),
            likedIds: new Set(JSON.parse(localStorage.getItem('mg_liked')) || [])
        };

        const feed = document.getElementById('problem-feed');
        const featuredContainer = document.getElementById('featured-container');
        const filterContainer = document.getElementById('filter-container');
        const headerEl = document.getElementById('sticky-header');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) headerEl.classList.add('border-stone-200', 'shadow-sm');
            else headerEl.classList.remove('border-stone-200', 'shadow-sm');
        });

        // --- FIREBASE LIKES LOGIC ---
        
        async function fetchLikes(id) {
            try {
                const docRef = doc(db, "likes", id.toString());
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    updateLikeUI(id, docSnap.data().count);
                } else {
                    updateLikeUI(id, 0); 
                }
            } catch(e) { console.log("Firebase inactive"); }
        }

        window.handleLike = async function(id) {
            if (state.likedIds.has(id)) return; 

            const countEl = document.getElementById(`like-count-${id}`);
            let current = parseInt(countEl.innerText) || 0;
            updateLikeUI(id, current + 1);
            state.likedIds.add(id);
            localStorage.setItem('mg_liked', JSON.stringify([...state.likedIds]));

            const docRef = doc(db, "likes", id.toString());
            try {
                await updateDoc(docRef, { count: increment(1) });
            } catch (e) {
                try { await setDoc(docRef, { count: 1 }); } catch(err){}
            }
        };

        function updateLikeUI(id, count) {
            const countEl = document.getElementById(`like-count-${id}`);
            const btnIcon = document.querySelector(`#like-btn-${id} svg`);
            if(countEl) countEl.innerText = count;
            if (state.likedIds.has(id) && btnIcon) {
                btnIcon.classList.add('liked-heart');
                btnIcon.setAttribute('fill', 'currentColor');
            }
        }

        // --- MATH RENDERER ---
        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        // --- RENDER FUNCTIONS ---

        function renderFeatured() {
            if (problems.length === 0) return;
            const randomProb = problems[Math.floor(Math.random() * problems.length)];
            const isSolved = state.solvedIds.has(randomProb.id);
            const iconSvg = getIcon(randomProb.category, randomProb, true);
            const categoryMap = { 'Logic': 'منطق', 'Combinatorics': 'ترکیبیات', 'Algorithms': 'الگوریتم', 'Probability': 'احتمال', 'Graph Theory': 'نظریه گراف', 'Geometry': 'هندسه' };
            const displayCat = categoryMap[randomProb.category] || randomProb.category;

            featuredContainer.innerHTML = `
                <div class="relative overflow-hidden rounded-2xl bg-stone-900 text-stone-50 shadow-xl p-8 md:p-14 min-h-[320px] flex flex-col justify-center transition-all duration-700 fade-in group">
                    <div class="absolute -left-16 -bottom-16 w-80 h-80 text-stone-800 opacity-20 transform group-hover:rotate-12 transition-transform duration-1000 pointer-events-none">${iconSvg}</div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="px-2 py-1 bg-amber-600 text-[11px] font-bold uppercase tracking-wider rounded text-white shadow-lg">چالش ویژه</span>
                            <span class="text-xs font-medium text-stone-400 border border-stone-700 px-3 py-1 rounded-full">${displayCat}</span>
                        </div>
                        <h2 class="text-2xl md:text-4xl font-black mb-6 leading-tight tracking-tight text-white drop-shadow-sm">${randomProb.title}</h2>
                        <div class="text-stone-300 text-lg md:text-xl leading-relaxed mb-10 max-w-2xl font-light problem-desc">${randomProb.text}</div>
                        <div class="flex flex-wrap gap-4">
                            <button onclick="window.toggle(${randomProb.id})" class="px-6 py-3 rounded-lg font-bold text-sm transition-all shadow-md transform active:scale-95 flex items-center gap-2 ${isSolved ? 'bg-green-600 text-white hover:bg-green-700' : 'bg-stone-50 text-stone-900 hover:bg-white hover:shadow-lg'}">
                                ${isSolved ? '✓ حل شد' : 'علامت زدن به عنوان حل شده'}
                            </button>
                            <button onclick="location.reload()" class="px-6 py-3 rounded-lg font-medium text-sm text-stone-400 hover:text-white hover:bg-stone-800 transition-colors border border-transparent hover:border-stone-700 flex items-center gap-2">
                                <span>بعدی</span><span>↻</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            renderMath();
        }

        function renderFeed(overrideProblems = null) {
            feed.innerHTML = '';
            const source = overrideProblems || problems;
            if (source.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                return;
            }
            let visible = 0;
            const sorted = [...source].sort((a, b) => {
                const aS = state.solvedIds.has(a.id);
                const bS = state.solvedIds.has(b.id);
                return aS === bS ? 0 : aS ? 1 : -1;
            });
            const categoryMap = { 'Logic': 'منطق', 'Combinatorics': 'ترکیبیات', 'Algorithms': 'الگوریتم', 'Probability': 'احتمال', 'Graph Theory': 'نظریه گراف', 'Geometry': 'هندسه' };

            sorted.forEach(p => {
                if (!overrideProblems && state.currentFilter !== 'all' && p.category !== state.currentFilter) return;
                visible++;
                
                const isSolved = state.solvedIds.has(p.id);
                const card = document.createElement('div');
                const displayCat = categoryMap[p.category] || p.category;
                card.className = `card-transition relative overflow-hidden p-6 rounded-xl border group ${isSolved ? 'bg-stone-100 border-stone-200 opacity-60' : 'bg-white border-stone-200 shadow-sm hover:border-stone-300'}`;
                const iconSvg = getIcon(p.category, p, false);

                fetchLikes(p.id);

                card.innerHTML = `
                    <div class="absolute -left-6 -bottom-6 w-32 h-32 opacity-100 transform rotate-0 pointer-events-none transition-transform duration-500 group-hover:scale-110">${iconSvg}</div>
                    <div class="relative z-10 pl-4">
                        <div class="flex justify-between items-baseline mb-3">
                            <span class="text-[10px] font-bold text-stone-400 uppercase tracking-wider bg-stone-50 px-2 py-1 rounded border border-stone-100">${displayCat}</span>
                            ${isSolved ? '<span class="text-[10px] text-green-600 font-bold bg-green-50 px-2 py-1 rounded">حل شده</span>' : ''}
                        </div>
                        <h3 class="font-extrabold text-stone-800 text-xl leading-snug mb-3 ${isSolved ? 'line-through text-stone-400' : ''}">${p.title}</h3>
                        <div class="text-sm text-stone-600 font-normal leading-relaxed mb-5 max-w-lg problem-desc text-justify">${p.text}</div>
                        
                        <div class="flex items-center justify-between mt-4">
                            <button onclick="window.toggle(${p.id})" class="text-xs font-semibold px-4 py-2 rounded-lg border border-stone-200 ${isSolved ? 'text-stone-400 bg-transparent' : 'text-stone-800 bg-white hover:bg-stone-50 hover:border-stone-300'} transition-all">
                                ${isSolved ? 'علامت زدن به عنوان حل نشده' : 'حل شد'}
                            </button>

                            <button id="like-btn-${p.id}" onclick="window.handleLike(${p.id})" class="like-btn flex items-center gap-1 text-stone-400 hover:text-red-500 transition-colors" title="لایک">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                </svg>
                                <span id="like-count-${p.id}" class="text-xs font-mono font-bold pt-0.5">0</span>
                            </button>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
            document.getElementById('no-results').classList.toggle('hidden', visible > 0);
            renderMath();
        }

        window.toggle = function(id) {
            if (state.solvedIds.has(id)) state.solvedIds.delete(id);
            else state.solvedIds.add(id);
            localStorage.setItem('mg_solved', JSON.stringify([...state.solvedIds]));
            renderFeed();
        };

        filterContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.className = 'filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors';
                });
                e.target.className = 'filter-btn shrink-0 text-xs font-semibold px-4 py-1.5 rounded-full bg-stone-900 text-white transition-colors';
                state.currentFilter = e.target.dataset.filter;
                renderFeed();
            }
        });

        document.getElementById('random-btn').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderFeatured();
        });

        // Initialize
        renderFeatured();
        renderFeed();
    </script>
</body>
</html>
