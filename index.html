<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرمش ذهن | معماهای منطقی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet" href="styles.css">

    <script src="data.js"></script>
</head>
<body class="min-h-screen max-w-5xl mx-auto px-4 py-8 md:py-12 selection:bg-amber-100 selection:text-amber-900 bg-[#f5f5f4]">

    <div id="featured-container" class="mb-12 mt-4"></div>

    <div class="sticky top-0 z-20 bg-[#f5f5f4]/95 backdrop-blur-sm py-3 mb-6 -mx-4 px-4 border-b border-transparent transition-all" id="sticky-header">
        <div class="flex justify-between items-center gap-4">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pl-4" id="filter-container">
                <button data-filter="all" class="filter-btn shrink-0 text-xs font-semibold px-4 py-1.5 rounded-full bg-stone-900 text-white transition-colors">همه</button>
                <button data-filter="Logic" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">منطق</button>
                <button data-filter="Combinatorics" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">ترکیبیات</button>
                <button data-filter="Algorithms" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">الگوریتم</button>
                <button data-filter="Graph Theory" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">نظریه گراف</button>
                <button data-filter="Geometry" class="filter-btn shrink-0 text-xs font-medium px-4 py-1.5 rounded-full text-stone-500 hover:bg-stone-200 transition-colors">هندسه</button>
            </div>
            <button id="random-btn" class="shrink-0 text-stone-400 hover:text-amber-600 transition-colors bg-white p-2 rounded-full shadow-sm border border-stone-200" title="انتخاب تصادفی">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            </button>
        </div>
    </div>

    <div id="problem-feed" class="flex flex-col gap-6 pb-20"></div>

    <div id="no-results" class="hidden text-center py-12">
        <p class="text-sm text-stone-400">موردی یافت نشد.</p>
        <button onclick="document.querySelector('[data-filter=all]').click()" class="mt-2 text-xs font-bold text-stone-900 hover:underline">پاک کردن فیلتر</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
