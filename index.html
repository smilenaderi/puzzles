<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرمش ذهن | معماهای منطقی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet" href="styles.css">
    <script src="data.js"></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 selection:bg-amber-200 selection:text-amber-900 font-vazir pb-20">

    <div class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" id="sticky-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20 gap-4">
                
                <div class="flex-1 overflow-x-auto no-scrollbar mask-linear">
                    <div class="flex gap-2 items-center pl-4 py-2" id="filter-container">
                        <button data-filter="all" class="filter-btn active-filter">همه</button>
                        <div class="w-px h-6 bg-stone-300 mx-1"></div> <button data-filter="liked" class="filter-btn text-rose-600 hover:bg-rose-50 hover:text-rose-700">مورد علاقه ❤️</button>
                        <div class="w-px h-6 bg-stone-300 mx-1"></div> <button data-filter="Logic" class="filter-btn">منطق</button>
                        <button data-filter="Combinatorics" class="filter-btn">ترکیبیات</button>
                        <button data-filter="Algorithms" class="filter-btn">الگوریتم</button>
                        <button data-filter="Graph Theory" class="filter-btn">نظریه گراف</button>
                        <button data-filter="Geometry" class="filter-btn">هندسه</button>
                    </div>
                </div>

                <button id="random-btn" class="shrink-0 bg-stone-900 text-white p-2.5 rounded-full hover:bg-amber-600 hover:scale-110 transition-all shadow-lg shadow-stone-300" title="معمای تصادفی">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.657 48.657 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3" /></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-24 md:mt-28">
        
        <div id="featured-container" class="mb-12"></div>

        <div class="flex items-center gap-4 mb-8">
            <h2 id="feed-title" class="text-2xl font-black text-stone-800 tracking-tight">آخرین معماها</h2>
            <div class="h-px bg-stone-200 flex-grow"></div>
        </div>

<div id="problem-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 md:gap-8 pb-20"></div>

        <div id="no-results" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-24 h-24 bg-stone-100 rounded-full flex items-center justify-center mb-4 text-4xl">📂</div>
            <p id="no-results-text" class="text-lg font-medium text-stone-500">موردی یافت نشد.</p>
            <button onclick="document.querySelector('[data-filter=all]').click()" class="mt-4 px-6 py-2 rounded-lg bg-stone-900 text-white text-sm font-bold hover:bg-stone-700 transition-colors">مشاهده همه معماها</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
